name: native-agents

# Controlador do atendimento nativo: issue `origin:app` -> Copilot (coordenador) -> PR.
# Roda SEMPRE a partir da main (workflow e script confiáveis). O PR só é lido como dado pela API:
# nenhum código do PR é executado com credencial de controle.
on:
  issues:
    types: [opened, labeled, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Número da issue origin:app para retomar"
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

# Uma execução por issue/PR de cada vez; as repetidas (opened + labeled) esperam e encontram o estado já gravado.
concurrency:
  group: native-agents-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  controlar:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'origin:app')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node automacao/controlador.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          AGENT_RUNTIME: ${{ vars.AGENT_RUNTIME || 'github-native' }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
