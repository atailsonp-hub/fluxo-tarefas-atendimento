name: native-agents

# Controlador do atendimento nativo: issue `origin:app` -> Copilot (coordenador) -> PR -> build verde -> entrega.
# Roda SEMPRE a partir da main (workflow e script confiáveis). O PR só é lido como dado pela API:
# nenhum código do PR é executado com credencial de controle (o build do PR roda em outro workflow, sem segredos).
on:
  issues:
    types: [opened, labeled, reopened]
  issue_comment:
    types: [created] # resposta do cliente a um esclarecimento (o controlador ignora o resto)
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_run:
    workflows: [build]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *" # varredura: reconcilia issues abertas (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Número da issue origin:app para retomar"
        required: true

# contents/pull-requests: write só para integrar o PR conferido (AUTO_MERGE=true) e corrigir o corpo do PR.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Uma execução por vez em cada issue (ou PR): as repetidas (opened + labeled) esperam e encontram o
# estado já gravado, então não há dupla atribuição. Issues diferentes não se bloqueiam nem se descartam.
concurrency:
  group: native-agents-${{ github.event.issue.number || inputs.issue_number || format('pr-{0}', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number) }}
  cancel-in-progress: false

jobs:
  controlar:
    if: (github.event_name != 'issues' && github.event_name != 'issue_comment') || (contains(github.event.issue.labels.*.name, 'origin:app') && !github.event.issue.pull_request && (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '<!-- cliente-msg:')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Triagem do N1/coordenador pelo Copilot CLI (só em modo real e só em eventos de issue).
      - name: Instalar Copilot CLI
        if: vars.AGENT_DRY_RUN == 'false' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_run'
        run: npm install --global @github/copilot@1.0.109
      - run: node automacao/controlador.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          # Token do CLI: PAT fino com Account > Copilot Requests (Read-only) e licença Copilot ativa.
          # Token sem essa permissão: a triagem falha e nada é atribuído (a issue fica em "novo" para retomar). AGENT_TRIAGE=false desliga a triagem.
          COPILOT_CLI_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN || secrets.COPILOT_AGENT_TOKEN }}
          AGENT_TRIAGE: ${{ vars.AGENT_TRIAGE || 'true' }}
          AGENT_RUNTIME: ${{ vars.AGENT_RUNTIME || 'github-native' }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE || 'false' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
